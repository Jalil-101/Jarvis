[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI operating layer — Phase 0 foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]
